
name: Run Pyforces Notebook in Codespace

on:
  workflow_dispatch:
    inputs:
      notebook:
        description: 'Notebook file name in codeforces_java (e.g. reruns_1 or pyforces_41_to_80.ipynb)'
        required: true
        default: 'reruns_1'

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      # 0. Normalise the notebook name (strip optional .ipynb) and validate it
      - name: Resolve notebook name
        id: nb
        env:
          NOTEBOOK_INPUT: ${{ inputs.notebook }}
        run: |
          NB="${NOTEBOOK_INPUT%.ipynb}"
          if ! [[ "$NB" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid notebook name: $NOTEBOOK_INPUT"
            exit 1
          fi
          echo "base=$NB" >> "$GITHUB_OUTPUT"

      # 1. Authenticate GitHub CLI
      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh auth status

      # 2. Dynamically find the existing Codespace
      - name: Find Codespace
        id: codespace
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          CODESPACE=$(gh codespace list \
            --repo "$GITHUB_REPOSITORY" \
            --json name \
            --jq '.[0].name')

          if [ -z "$CODESPACE" ]; then
            echo "No Codespace found!"
            exit 1
          fi

          echo "Found Codespace: $CODESPACE"

          echo "name=$CODESPACE" >> "$GITHUB_OUTPUT"

      # 3. Start the existing Codespace
      - name: Start Codespace
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODESPACE: ${{ steps.codespace.outputs.name }}
        run: |
          # `gh codespace start` doesn't exist in this gh version; use the REST API
          gh api -X POST "/user/codespaces/$CODESPACE/start" --silent

      # 4. Pull repository and execute notebook
      - name: Pull and execute notebook remotely
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODESPACE: ${{ steps.codespace.outputs.name }}
          PYFORCES_HEADER_JSON: ${{ secrets.PYFORCES_HEADER_JSON }}
          NB: ${{ steps.nb.outputs.base }}
        run: |
          printf -v REMOTE_HEADER '%q' "$PYFORCES_HEADER_JSON"

          gh codespace ssh -c "$CODESPACE" -- \
            bash -lc "
              set -e

              cd /workspaces/leetcode_programming

              echo 'Pulling latest changes...'
              git config pull.rebase true
              git pull --autostash

              cd codeforces_java

              echo 'Installing Papermill...'
              python -m pip install papermill

              export CHOICE=0
              export PYFORCES_HEADER_JSON=$REMOTE_HEADER

              echo 'Executing Jupyter Notebook...'
              papermill $NB.ipynb ${NB}_executed.ipynb

              echo 'Replacing input notebook with executed one...'
              mv -f ${NB}_executed.ipynb $NB.ipynb

              echo 'Notebook execution completed!'
            "

      # 5. Download executed notebook
      - name: Download executed notebook
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODESPACE: ${{ steps.codespace.outputs.name }}
          NB: ${{ steps.nb.outputs.base }}
        run: |
          mkdir -p output

          gh codespace ssh -c "$CODESPACE" -- \
            "ls -la /workspaces/leetcode_programming/codeforces_java/ | grep -i $NB || echo 'NO matching files found'"

          # scp-based `gh codespace cp` reports "No such file" for a file that exists,
          # so stream it over ssh instead
          gh codespace ssh -c "$CODESPACE" -- \
            cat /workspaces/leetcode_programming/codeforces_java/$NB.ipynb \
            > output/$NB.ipynb

          ls -la output/
          python3 -c "import json; json.load(open('output/$NB.ipynb'))"

      # 6. Upload executed notebook
      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: output/${{ steps.nb.outputs.base }}.ipynb
          retention-days: 7

      # 7. Commit and push the executed notebook from the Codespace
      - name: Push executed notebook
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODESPACE: ${{ steps.codespace.outputs.name }}
          REPO: ${{ github.repository }}
          NB: ${{ steps.nb.outputs.base }}
        run: |
          # Non-interactive ssh sessions have no git credentials, so push with the token
          printf -v REMOTE_TOKEN '%q' "$GH_TOKEN"

          gh codespace ssh -c "$CODESPACE" -- \
            bash -lc "
              set -e

              cd /workspaces/leetcode_programming

              git add codeforces_java/$NB.ipynb

              if git diff --cached --quiet; then
                echo 'No new changes to commit (pushing any existing local commits).'
              else
                git -c user.name='github-actions' -c user.email='github-actions@users.noreply.github.com' \
                  commit -m 'Add executed $NB notebook'
              fi

              PUSH_URL=https://x-access-token:$REMOTE_TOKEN@github.com/$REPO.git

              git pull --rebase --autostash \$PUSH_URL main
              git push \$PUSH_URL HEAD:main

              # Pushing to a URL doesn't update origin/main, so the codespace would keep
              # showing 'N commits ahead'. Refresh the local tracking ref.
              git fetch \$PUSH_URL +main:refs/remotes/origin/main
            "

      # 8. Stop the Codespace (runs even if an earlier step failed)
      - name: Stop Codespace
        if: always() && steps.codespace.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODESPACE: ${{ steps.codespace.outputs.name }}
        run: |
          gh codespace stop -c "$CODESPACE"
