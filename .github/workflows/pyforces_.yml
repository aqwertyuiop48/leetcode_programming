
name: Run Pyforces Notebook in Codespace

on:
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      # 1. Authenticate GitHub CLI
      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh auth status

      # 2. Dynamically find the existing Codespace
      - name: Find Codespace
        id: codespace
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          CODESPACE=$(gh codespace list \
            --repo "$GITHUB_REPOSITORY" \
            --json name \
            --jq '.[0].name')

          if [ -z "$CODESPACE" ]; then
            echo "No Codespace found!"
            exit 1
          fi

          echo "Found Codespace: $CODESPACE"

          echo "name=$CODESPACE" >> "$GITHUB_OUTPUT"

      # 3. Start the existing Codespace
      - name: Start Codespace
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODESPACE: ${{ steps.codespace.outputs.name }}
        run: |
          # `gh codespace start` doesn't exist in this gh version; use the REST API
          gh api -X POST "/user/codespaces/$CODESPACE/start" --silent

      # 4. Pull repository and execute notebook
      - name: Pull and execute notebook remotely
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODESPACE: ${{ steps.codespace.outputs.name }}
          PYFORCES_HEADER_JSON: ${{ secrets.PYFORCES_HEADER_JSON }}
        run: |
          printf -v REMOTE_HEADER '%q' "$PYFORCES_HEADER_JSON"

          gh codespace ssh -c "$CODESPACE" -- \
            bash -lc "
              set -e

              cd /workspaces/leetcode_programming

              echo 'Pulling latest changes...'
              git pull

              cd codeforces_java

              echo 'Installing Papermill...'
              python -m pip install papermill

              export CHOICE=0
              export PYFORCES_HEADER_JSON=$REMOTE_HEADER

              echo 'Executing Jupyter Notebook...'
              papermill reruns_1.ipynb reruns_1_executed.ipynb

              echo 'Notebook execution completed!'
            "

      # 5. Download executed notebook
      - name: Download executed notebook
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODESPACE: ${{ steps.codespace.outputs.name }}
        run: |
          mkdir -p output

          gh codespace ssh -c "$CODESPACE" -- \
            "ls -la /workspaces/leetcode_programming/codeforces_java/ | grep -i reruns || echo 'NO reruns files found'"

          # scp-based `gh codespace cp` reports "No such file" for a file that exists,
          # so stream it over ssh instead
          gh codespace ssh -c "$CODESPACE" -- \
            cat /workspaces/leetcode_programming/codeforces_java/reruns_1_executed.ipynb \
            > output/reruns_1_executed.ipynb

          ls -la output/
          python3 -c "import json; json.load(open('output/reruns_1_executed.ipynb'))"

      # 6. Upload executed notebook
      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: output/reruns_1_executed.ipynb
          retention-days: 7

      # 7. Commit and push the executed notebook from the Codespace
      - name: Push executed notebook
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CODESPACE: ${{ steps.codespace.outputs.name }}
        run: |
          gh codespace ssh -c "$CODESPACE" -- \
            bash -lc "
              set -e

              cd /workspaces/leetcode_programming

              git add codeforces_java/reruns_1_executed.ipynb

              if git diff --cached --quiet; then
                echo 'No changes to commit.'
                exit 0
              fi

              git -c user.name='github-actions' -c user.email='github-actions@users.noreply.github.com' \
                commit -m 'Add executed reruns_1 notebook'

              git pull --rebase
              git push
            "
