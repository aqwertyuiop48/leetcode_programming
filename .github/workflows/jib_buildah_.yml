name: Jib and Buildah Workflow

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      # Setup Java for Jib builds
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Log in to Docker Hub once for all Buildah pushes
      - name: Log in to Docker Hub for Buildah
        uses: redhat-actions/podman-login@v1
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

############################### JVM Applications (Google Jib) ###############################

      # 1. Helidon Demo (Kotlin) -> Repo: codeforces_script (branch: helidon_kotlin_)
      - name: Checkout - helidon-demo-kotlin
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'helidon_kotlin_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-helidon-kotlin'

      - name: Build & Push (Jib) - helidon-demo-kotlin
        working-directory: ./repo-helidon-kotlin
        run: |
          ./gradlew jib \
            -Djib.to.image=sreedockerhub19/helidon-demo-kotlin:latest \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Helidon Demo (Java) -> Repo: codeforces_script (branch: helidon_java_)
      - name: Checkout - helidon-demo
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'helidon_java_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-helidon-java'

      - name: Build & Push (Jib) - helidon-demo
        working-directory: ./repo-helidon-java
        run: |
          ./mvnw compile jib:toContainer \
            -Dimage=sreedockerhub19/helidon-demo:latest \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Micronaut (Java) -> Repo: codeforces_script (branch: micronaut_java_)
      - name: Checkout - micronaut-java
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'micronaut_java_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-micronaut-java'

      - name: Build & Push (Jib) - micronaut-java
        working-directory: ./repo-micronaut-java
        run: |
          ./mvnw compile jib:toContainer \
            -Dimage=sreedockerhub19/micronaut-java:latest \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Micronaut (Kotlin) -> Repo: codeforces_script (branch: micronaut_kotlin_)
      - name: Checkout - micronaut-kotlin
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'micronaut_kotlin_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-micronaut-kotlin'

      - name: Build & Push (Jib) - micronaut-kotlin
        working-directory: ./repo-micronaut-kotlin
        run: |
          ./gradlew jib \
            -Djib.to.image=sreedockerhub19/micronaut-kotlin:latest \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Simple HTTP Server (Java) -> Repo: http4j_java (branch: main)
      - name: Checkout - simple-http-server
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/http4j_java'
          ref: 'main'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-http4j-java'

      - name: Build & Push (Jib) - simple-http-server
        working-directory: ./repo-http4j-java
        run: |
          ./mvnw compile jib:toContainer \
            -Dimage=sreedockerhub19/simple-http-server:latest \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Simple HTTP Server (Kotlin) -> Repo: http4j_java (branch: kotlin_)
      - name: Checkout - simple-http-server-kotlin
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/http4j_java'
          ref: 'kotlin_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-http4j-kotlin'

      - name: Build & Push (Jib) - simple-http-server-kotlin
        working-directory: ./repo-http4j-kotlin
        run: |
          ./gradlew jib \
            -Djib.to.image=sreedockerhub19/simple-http-server-kotlin:latest \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

############################### Non-JVM Applications (Buildah Only) ###############################

      # 7. News Search Service -> Repo: nextjs_news_search_microservices (branch: main)
      - name: Checkout - news-search-service
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/nextjs_news_search_microservices'
          ref: 'main'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}

      - name: Build (Buildah) - news-search-service
        uses: redhat-actions/buildah-build@v2
        with:
          image: sreedockerhub19/news-search-service
          tags: latest
          context: ./repo-news-search-service
          containerfiles: ./repo-news-search-service/Dockerfile

      - name: Push - news-search-service
        uses: redhat-actions/push-to-registry@v2
        with:
          image: sreedockerhub19/news-search-service
          tags: latest
          registry: docker.io

      # 8. Angular App -> Repo: my_angular_app (branch: main)
      - name: Checkout - my-angular-app
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/my_angular_app'
          ref: 'main'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-angular-app'

      - name: Build (Buildah) - my-angular-app
        uses: redhat-actions/buildah-build@v2
        with:
          image: sreedockerhub19/my-angular-app
          tags: latest
          context: ./repo-angular-app
          containerfiles: ./repo-angular-app/Dockerfile

      - name: Push - my-angular-app
        uses: redhat-actions/push-to-registry@v2
        with:
          image: sreedockerhub19/my-angular-app
          tags: latest
          registry: docker.io

      # 9. Angular App Main -> Repo: my_angular_app (branch: main_)
      - name: Checkout - my-angular-app-main
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/my_angular_app'
          ref: 'main_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-angular-app-main'

      - name: Build (Buildah) - my-angular-app-main
        uses: redhat-actions/buildah-build@v2
        with:
          image: sreedockerhub19/my-angular-app-main
          tags: latest
          context: ./repo-angular-app-main
          containerfiles: ./repo-angular-app-main/Dockerfile

      - name: Push - my-angular-app-main
        uses: redhat-actions/push-to-registry@v2
        with:
          image: sreedockerhub19/my-angular-app-main
          tags: latest
          registry: docker.io

      # 10. NextJS App -> Repo: nextjs_app (branch: main)
      - name: Checkout - my-nextjs-app
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/nextjs_app'
          ref: 'main'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-nextjs-app'

      - name: Build (Buildah) - my-nextjs-app
        uses: redhat-actions/buildah-build@v2
        with:
