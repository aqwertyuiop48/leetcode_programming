      - name: Push - my-nextjs-app-typescript
        uses: redhat-actions/push-to-registry@v2
        with:
          image: sreedockerhub19/my-nextjs-app-typescript
          tags: latest
          registry: docker.io

      # 13. Ruby HTTP Server -> Repo: codeforces_script (branch: ruby_)
      - name: Checkout - ruby-http-server
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'ruby_'
