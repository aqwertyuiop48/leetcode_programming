name: Jib and Buildah Workflow

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      # Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Setup Gradle for fallback/global Gradle availability
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Setup Docker Buildx / Daemon
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub via Docker CLI
      - name: Log in to Docker Hub (Docker CLI)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Setup Docker Config JSON for Kaniko Authentication
      - name: Create Docker Config for Kaniko
        run: |
          mkdir -p ~/.docker
          echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n ${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }} | base64)\"}}}" > ~/.docker/config.json

      # Setup Pack CLI for Cloud Native Buildpacks
      - name: Setup Pack CLI
        uses: buildpacks/github-actions/setup-pack@v5.8.0

      # Log in to Docker Hub for Buildah / Podman steps
      - name: Log in to Docker Hub for Buildah
        uses: redhat-actions/podman-login@v1
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

############################### JVM Applications (Auto-Detect Build Tool) ###############################

      # 2. Helidon Demo (Java) -> Auto-detect Maven or Gradle -> Kaniko
      - name: Checkout - helidon-demo
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'helidon_java_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-helidon-java'

      - name: Auto-Detect & Build Binaries - helidon-demo
        working-directory: ./repo-helidon-java
        run: |
          if [ -f "pom.xml" ]; then
            echo "Detected Maven project"
            if [ ! -f "mvnw" ]; then mvn wrapper:wrapper; fi
            chmod +x mvnw
            ./mvnw clean package -DskipTests
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Detected Gradle project"
            if [ ! -f "gradlew" ]; then gradle wrapper; fi
            chmod +x gradlew
            ./gradlew build -x test
          fi

      - name: Build & Push (Kaniko) - helidon-demo
        uses: aevea/action-kaniko@v1.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          image: sreedockerhub19/helidon-demo
          tag: latest
          path: repo-helidon-java
          dockerfile: repo-helidon-java/Dockerfile

      # 1. Helidon Demo (Kotlin) -> Auto-detect Maven or Gradle -> Pack CLI
      - name: Checkout - helidon-demo-kotlin
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'helidon_kotlin_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-helidon-kotlin'

      - name: Build & Push (Pack CLI / Auto-Detect) - helidon-demo-kotlin
        working-directory: ./repo-helidon-kotlin
        run: |
          if [ -f "pom.xml" ]; then
            echo "Detected Maven project"
            if [ ! -f "mvnw" ]; then mvn wrapper:wrapper; fi
            chmod +x mvnw
            ./mvnw clean package -DskipTests
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Detected Gradle project"
            if [ ! -f "gradlew" ]; then gradle wrapper; fi
            chmod +x gradlew
            ./gradlew build -x test
          else
            echo "Error: Neither pom.xml nor build.gradle found!" && exit 1
          fi

          pack build sreedockerhub19/helidon-demo-kotlin:latest \
            --builder paketobuildpacks/builder-jammy-base \
            --publish

      # 3. Micronaut (Java) -> Auto-detect Maven or Gradle -> Docker Buildx
      - name: Checkout - micronaut-java
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'micronaut_java_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-micronaut-java'

      - name: Auto-Detect & Build Binaries - micronaut-java
        working-directory: ./repo-micronaut-java
        run: |
          if [ -f "pom.xml" ]; then
            echo "Detected Maven project"
            if [ ! -f "mvnw" ]; then mvn wrapper:wrapper; fi
            chmod +x mvnw
            ./mvnw clean package -DskipTests
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Detected Gradle project"
            if [ ! -f "gradlew" ]; then gradle wrapper; fi
            chmod +x gradlew
            ./gradlew build -x test
          fi

      - name: Build & Push (Docker Buildx) - micronaut-java
        uses: docker/build-push-action@v5
        with:
          context: ./repo-micronaut-java
          push: true
          tags: sreedockerhub19/micronaut-java:latest

      # 4. Micronaut (Kotlin) -> Auto-detect Maven or Gradle -> Pack CLI
      - name: Checkout - micronaut-kotlin
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'micronaut_kotlin_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-micronaut-kotlin'

      - name: Build & Push (Pack CLI / Auto-Detect) - micronaut-kotlin
        working-directory: ./repo-micronaut-kotlin
        run: |
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Detected Gradle project"
            if [ ! -f "gradlew" ]; then gradle wrapper; fi
            chmod +x gradlew
            ./gradlew build -x test
          elif [ -f "pom.xml" ]; then
            echo "Detected Maven project"
            if [ ! -f "mvnw" ]; then mvn wrapper:wrapper; fi
            chmod +x mvnw
            ./mvnw clean package -DskipTests
          else
            echo "Error: Neither build.gradle nor pom.xml found!" && exit 1
          fi

          pack build sreedockerhub19/micronaut-kotlin:latest \
            --builder paketobuildpacks/builder-jammy-base \
            --publish

      # 5. Simple HTTP Server (Java) -> Auto-detect Maven or Gradle -> Kaniko
      - name: Checkout - simple-http-server
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/http4j_java'
          ref: 'main'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-http4j-java'

      - name: Auto-Detect & Build Binaries - simple-http-server
        working-directory: ./repo-http4j-java
        run: |
          if [ -f "pom.xml" ]; then
            echo "Detected Maven project"
            if [ ! -f "mvnw" ]; then mvn wrapper:wrapper; fi
            chmod +x mvnw
            ./mvnw clean package -DskipTests
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Detected Gradle project"
            if [ ! -f "gradlew" ]; then gradle wrapper; fi
            chmod +x gradlew
            ./gradlew build -x test
          fi

      - name: Build & Push (Kaniko) - simple-http-server
        uses: aevea/action-kaniko@v1.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          image: sreedockerhub19/simple-http-server
          tag: latest
          path: repo-http4j-java
          dockerfile: repo-http4j-java/Dockerfile

      # 6. Simple HTTP Server (Kotlin) -> Auto-detect Maven or Gradle -> Docker Buildx
      - name: Checkout - simple-http-server-kotlin
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/http4j_java'
          ref: 'kotlin_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-http4j-kotlin'

      - name: Auto-Detect & Build Binaries - simple-http-server-kotlin
        working-directory: ./repo-http4j-kotlin
        run: |
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Detected Gradle project"
            if [ ! -f "gradlew" ]; then gradle wrapper; fi
            chmod +x gradlew
            ./gradlew build -x test
          elif [ -f "pom.xml" ]; then
            echo "Detected Maven project"
            if [ ! -f "mvnw" ]; then mvn wrapper:wrapper; fi
            chmod +x mvnw
            ./mvnw clean package -DskipTests
          fi

      - name: Build & Push (Docker Buildx) - simple-http-server-kotlin
        uses: docker/build-push-action@v5
        with:
          context: ./repo-http4j-kotlin
          push: true
          tags: sreedockerhub19/simple-http-server-kotlin:latest

############################### Non-JVM Applications (Buildah) ###############################

      # 7. News Search Service
      - name: Checkout - news-search-service
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/nextjs_news_search_microservices'
          ref: 'main'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-news-search-service'

      - name: Build (Buildah) - news-search-service
        uses: redhat-actions/buildah-build@v2
        with:
          image: sreedockerhub19/news-search-service
          tags: latest
          context: ./repo-news-search-service
          containerfiles: ./repo-news-search-service/Dockerfile

      - name: Push - news-search-service
        uses: redhat-actions/push-to-registry@v2
