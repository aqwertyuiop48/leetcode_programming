name: Jib and Buildah Workflow

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      # Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Setup Gradle for wrapper fallback
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Setup Docker Buildx / Daemon for steps using Docker/Buildpacks
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub via Docker CLI
      - name: Log in to Docker Hub (Docker CLI)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Setup Pack CLI for Cloud Native Buildpacks
      - name: Setup Pack CLI
        uses: buildpacks/github-actions/setup-pack@v5.8.0

      # Log in to Docker Hub for Buildah / Podman steps
      - name: Log in to Docker Hub for Buildah
        uses: redhat-actions/podman-login@v1
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

############################### JVM Applications (Alternative Build Methods) ###############################

      # 1. Helidon Demo (Kotlin) -> Using Gradle Boot/Buildpack plugin OR Pack CLI
      - name: Checkout - helidon-demo-kotlin
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'helidon_kotlin_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-helidon-kotlin'

      - name: Build & Push (Pack CLI / CNB) - helidon-demo-kotlin
        working-directory: ./repo-helidon-kotlin
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew build -x test
          pack build sreedockerhub19/helidon-demo-kotlin:latest \
            --builder paketobuildpacks/builder-jammy-base \
            --publish

      # 2. Helidon Demo (Java) -> Using Maven Spring Boot / Buildpack plugin
      - name: Checkout - helidon-demo
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'helidon_java_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-helidon-java'

      - name: Build & Push (Kaniko) - helidon-demo
        uses: aevea/action-kaniko@v0.14.0
        with:
          image: sreedockerhub19/helidon-demo
          tag: latest
          path: ./repo-helidon-java
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Micronaut (Java) -> Using Micronaut Native Buildpack / Dockerfile build
      - name: Checkout - micronaut-java
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'micronaut_java_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-micronaut-java'

      - name: Build & Push (Docker Buildx / BuildKit) - micronaut-java
        uses: docker/build-push-action@v5
        with:
          context: ./repo-micronaut-java
          push: true
          tags: sreedockerhub19/micronaut-java:latest

      # 4. Micronaut (Kotlin) -> Using Gradle bootBuildImage / Cloud Native Buildpacks
      - name: Checkout - micronaut-kotlin
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'micronaut_kotlin_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-micronaut-kotlin'

      - name: Build & Push (Pack CLI) - micronaut-kotlin
        working-directory: ./repo-micronaut-kotlin
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew build -x test
          pack build sreedockerhub19/micronaut-kotlin:latest \
            --builder paketobuildpacks/builder-jammy-base \
            --publish

      # 5. Simple HTTP Server (Java) -> Using Kaniko Action
      - name: Checkout - simple-http-server
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/http4j_java'
          ref: 'main'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-http4j-java'

      - name: Build & Push (Kaniko) - simple-http-server
        uses: aevea/action-kaniko@v0.14.0
        with:
          image: sreedockerhub19/simple-http-server
          tag: latest
          path: ./repo-http4j-java
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Simple HTTP Server (Kotlin) -> Using Docker Buildx
      - name: Checkout - simple-http-server-kotlin
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/http4j_java'
          ref: 'kotlin_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-http4j-kotlin'

      - name: Build & Push (Docker Buildx) - simple-http-server-kotlin
        uses: docker/build-push-action@v5
        with:
          context: ./repo-http4j-kotlin
          push: true
          tags: sreedockerhub19/simple-http-server-kotlin:latest

############################### Non-JVM Applications (Buildah) ###############################

      # 7. News Search Service
      - name: Checkout - news-search-service
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/nextjs_news_search_microservices'
          ref: 'main'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-news-search-service'

      - name: Build (Buildah) - news-search-service
        uses: redhat-actions/buildah-build@v2
        with:
          image: sreedockerhub19/news-search-service
          tags: latest
          context: ./repo-news-search-service
          containerfiles: ./repo-news-search-service/Dockerfile

      - name: Push - news-search-service
        uses: redhat-actions/push-to-registry@v2
        with:
          image: sreedockerhub19/news-search-service
          tags: latest
          registry: docker.io

      # 8. Angular App
      - name: Checkout - my-angular-app
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/my_angular_app'
          ref: 'main'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-angular-app'

      - name: Build (Buildah) - my-angular-app
        uses: redhat-actions/buildah-build@v2
        with:
          image: sreedockerhub19/my-angular-app
          tags: latest
          context: ./repo-angular-app
          containerfiles: ./repo-angular-app/Dockerfile

      - name: Push - my-angular-app
        uses: redhat-actions/push-to-registry@v2
        with:
          image: sreedockerhub19/my-angular-app
          tags: latest
          registry: docker.io

      # 9. Angular App Main
      - name: Checkout - my-angular-app-main
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/my_angular_app'
          ref: 'main_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-angular-app-main'

      - name: Build (Buildah) - my-angular-app-main
        uses: redhat-actions/buildah-build@v2
        with:
          image: sreedockerhub19/my-angular-app-main
          tags: latest
          context: ./repo-angular-app-main
          containerfiles: ./repo-angular-app-main/Dockerfile

      - name: Push - my-angular-app-main
        uses: redhat-actions/push-to-registry@v2
        with:
          image: sreedockerhub19/my-angular-app-main
          tags: latest
          registry: docker.io

      # 10. NextJS App
      - name: Checkout - my-nextjs-app
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/nextjs_app'
          ref: 'main'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-nextjs-app'

      - name: Build (Buildah) - my-nextjs-app
        uses: redhat-actions/buildah-build@v2
        with:
          image: sreedockerhub19/my-nextjs-app
          tags: latest
          context: ./repo-nextjs-app
          containerfiles: ./repo-nextjs-app/Dockerfile

      - name: Push - my-nextjs-app
        uses: redhat-actions/push-to-registry@v2
        with:
          image: sreedockerhub19/my-nextjs-app
          tags: latest
          registry: docker.io

      # 11. NextJS App TS-JS
      - name: Checkout - my-nextjs-app-ts-js
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/nextjs_app'
          ref: 'ts_js'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-nextjs-app-ts-js'

      - name: Build (Buildah) - my-nextjs-app-ts-js
        uses: redhat-actions/buildah-build@v2
        with:
          image: sreedockerhub19/my-nextjs-app-ts-js
          tags: latest
          context: ./repo-nextjs-app-ts-js
          containerfiles: ./repo-nextjs-app-ts-js/Dockerfile

      - name: Push - my-nextjs-app-ts-js
        uses: redhat-actions/push-to-registry@v2
        with:
          image: sreedockerhub19/my-nextjs-app-ts-js
          tags: latest
          registry: docker.io

      # 12. NextJS App Typescript
      - name: Checkout - my-nextjs-app-typescript
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/nextjs_app'
          ref: 'typescript'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-nextjs-app-typescript'

      - name: Build (Buildah) - my-nextjs-app-typescript
        uses: redhat-actions/buildah-build@v2
        with:
          image: sreedockerhub19/my-nextjs-app-typescript
          tags: latest
          context: ./repo-nextjs-app-typescript
          containerfiles: ./repo-nextjs-app-typescript/Dockerfile

      - name: Push - my-nextjs-app-typescript
        uses: redhat-actions/push-to-registry@v2
        with:
          image: sreedockerhub19/my-nextjs-app-typescript
          tags: latest
          registry: docker.io

      # 13. Ruby HTTP Server
      - name: Checkout - ruby-http-server
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'ruby_'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-ruby-http-server'

      - name: Build (Buildah) - ruby-http-server
        uses: redhat-actions/buildah-build@v2
        with:
