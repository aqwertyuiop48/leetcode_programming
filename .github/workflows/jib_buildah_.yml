          image: sreedockerhub19/ruby-http-server
          tags: latest
          registry: docker.io

      # 14. Cypress Tests
      - name: Checkout - cypress-tests
        uses: actions/checkout@v4
        with:
          repository: 'aqwertyuiop48/codeforces_script'
          ref: 'cypress_testing'
          token: ${{ secrets.TRIGGER_PAT_AQWERTYUIOP48 }}
          path: 'repo-cypress-tests'

      - name: Build (Buildah) - cypress-tests
        uses: redhat-actions/buildah-build@v2
