name: Configure pyforces

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyforces
        run: python -m pip install pyforces-cli

      - name: Configure pyforces headers
        env:
          PYFORCES_HEADERS: ${{ secrets.PYFORCES_HEADERS }}
        shell: bash
        run: |
          if [[ -z "$PYFORCES_HEADERS" ]]; then
            echo "::error::Add your Codeforces request headers as the PYFORCES_HEADERS repository secret."
            exit 1
          fi

          mkdir -p "$HOME/.pyforces"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from pyforces.utils import parse_firefox_http_headers

          raw = json.loads(os.environ["PYFORCES_HEADERS"])

          headers = parse_firefox_http_headers(raw)

          if not isinstance(headers, dict) or not all(
              isinstance(k, str) and isinstance(v, str)
              for k, v in headers.items()
          ):
              raise SystemExit("Invalid HTTP headers.")

          path = Path.home() / ".pyforces" / "headers.txt"
          path.write_text(json.dumps(headers), encoding="utf-8")
          path.chmod(0o600)

          print("Headers configured successfully.")
          PY

      - name: Verify pyforces login
        shell: bash
        run: |
          if [[ -z "$PYFORCES_HEADERS" ]]; then
            echo "::error::PYFORCES_HEADERS secret is missing."
            exit 1
          fi

          if ! output="$(printf '0\n%s\n' "$PYFORCES_HEADERS" | pyforces config 2>&1)"; then
            echo "::error::pyforces login command failed."
            exit 1
          fi

          if [[ "$output" == *"Welcome "* ]]; then
            echo "pyforces login successful!"
          else
            echo "::error::Codeforces authentication failed."
            # Avoid printing potentially sensitive diagnostic output.
            exit 1
          fi
